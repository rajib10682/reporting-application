server:
  port: 8082

spring:
  application:
    name: report-service
  datasource:
    url: jdbc:postgresql://localhost:5432/reportdb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  redis:
    host: localhost
    port: 6379
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

reporting:
  concurrency:
    max-concurrent-reports: 5
    queue-timeout-minutes: 30
  database:
    query-timeout-seconds: 300
    max-result-rows: 100000
  export:
    formats: [CSV, JSON, EXCEL]
    max-file-size-mb: 50
    output-directory: /tmp/reports
